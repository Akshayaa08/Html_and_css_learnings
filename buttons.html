<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
</head>
<body>
    <a href="https://www.google.com/" target="_blank">
    <button style="font-size: 25px; background-color: blue; color: aliceblue;border-radius: 25px;border-color: lightseagreen;">Click me</button>
    </a>
    <br>
    <br>
    <a href="buttons_2.0.html" target="_blank">
    <button style="font-size: 25px; background-color: rgb(255, 0, 8); color: aliceblue;border-radius: 25px;border-color: yellow;">Click me</button>
    </a>
    <br>
    <br>
    <button onclick="doSomething()" style="font-size: 25px; background-color: palevioletred; color: aliceblue;border-radius: 25px;border-color: red;">Click me</button>
    <p id="greeting">Hello</p>
    <script>
        function doSomething(){
            document.getElementById("greeting").innerHTML="Goodbye"
        }
    </script>
</body>
</html>
