<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">
        <!--enctype is encrpytion type when large amount of data is breakdown into multiple parts and those parts will be reassemble when receiving -->
        <label for="username"> Username:</label>
        <input type="text" id="username"placeholder="Enter a username" minlength="6" maxlength="15" required><br>
        
        <label for="password"> Password: </label>
        <input type="password" id="password" placeholder="Enter a password" minlength="6" maxlength="15" required><br>
       
        <label for="email"> Email: </label>
        <input type ="email" id="email" placeholder="Enter a email"><br>
       
        <label for="phn"> Phone number: </label>
        <input type ="tel" id="phn" placeholder="Enter a phone number" pattern="[0-9]{10}"><br>
        
        <label for="bday"> Birthdate: </label>
        <input type="date" id="bday"><br>
        
        <label for="quantity">Quantity</label>
        <input type="number" id=" quantity" min="0" max="100" value="1"> <br>
        <!--value ="1" is a default value-->

        <label for="title">Title: </label>
        <label for="Mr">Mr.</label>
        <input type="radio" id="Mr" value="Mr." name="title">
        <label for="Mrs">Mrs.</label>
        <input type="radio" id="Mrs" value="Mrs." name="title">
        <label for="PhD.">PhD.</label>
        <input type="radio" id="PhD" value="PhD." name="title"><br>
        <!--the value overhere is passed to make the text to store in the form-->
    
        <label for="payment">payment</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="mastercard">mastercard</option>
            <option value="giftcard">giftcard</option>
        </select><br>

        <label for="subscribe">subscribe:</label>
        <input type ="checkbox" id="subscribe"><br>        

        <label for="comment">comment:</label>
        <textarea id="comment" rows="3" cols="25">

        </textarea><br>

        <label for="file">File:</label>
        <input type="file" id="file" accept="image/png, image/jpeg"><br>
        <!--accept is it selects only those specified data to be uploaded    -->

        
        <br><br>
        <input type="reset"> 
        <br><br>
        <input type="submit">

    </form>
    
</body>
</html>
