<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="image_gallery.css">
</head>
<body>
    <div class ="gallery">
        <a target="_blank" href="/images/dog.png">
        <img src="/images/dog.png" alt="German Shepherd Dog" >
        <div class ="description">German Shepherd Dog</div>
    </div>

    
    <div class ="gallery">
        <a target="_blank" href="/images/smiling dog.gif">
        <img src="/images/smiling dog.gif" alt="Smiling Dog Dog" width="200" height="200">
        </a>
        <div class ="description">Smiling Dog Dog</div>
    </div>
    
    <div class ="gallery">
        <a target="_blank" href="/images/AG.png">
        <img src="/images/AG.png" alt="AG logo" width="200" height="200">
        </a>
        <div class ="description">AG Logo</div>
    </div>

    
</body>
</html>
