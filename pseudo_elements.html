<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Elements</title>
    <link rel="stylesheet" href="pseudo_elements_styles.css">
</head>
<body>
    <!-- pseudo elements = Keyword added after a selector 
     thats used to style a specific parts of an element
     selector::pesudo element
     h1::first-letter{}
     -->
    <h1>Hello</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Impedit error voluptas, nisi sequi, velit aut ratione nobis possimus tempore optio distinctio id saepe, atque odit repellendus voluptate hic quia provident!</p>
    <ul id="fruit">
        <li id="apple">Apple</li>
        <li id="orange">orange</li>
        <li id="banana">banana</li>
    </ul>    
</body>
</html>
